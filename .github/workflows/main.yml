name: Build Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernel_build_version:
        description: "Kernel version to build"
        type: choice
        options:
          - a12-5-10
          - genevn
          - all
        default: "a12-5-10"
      ksu_variant:
        description: "KernelSU variant"
        type: choice
        options:
          - KernelSU-Next
        default: "KernelSU-Next"
      device_codename:
        description: "Device profile (codename from device-profiles.json)"
        type: choice
        options:
          - genevn-g
          - lake
        default: "genevn-g"
      kernel_branch:
        description: "kernel-msm-1 branch (genevn only)"
        type: string
        default: "android-14-release-u1tgns34.42-86-2-32"

jobs:
  build-a12-5-10:
    if: ${{ inputs.kernel_build_version == 'all' || inputs.kernel_build_version == 'a12-5-10' }}
    uses: ./.github/workflows/kernel-a12-5.10.yml
    secrets: inherit
    with:
      ksu_variant: ${{ inputs.ksu_variant }}
      add_susfs: true
      add_zeromount: true
      add_zram: true
      add_bbg: true
      add_overlayfs_support: true
      add_kpm: false
      sukisu_commit: ""
      device_codename: ${{ inputs.device_codename }}

  build-genevn:
    if: ${{ inputs.kernel_build_version == 'genevn' }}
    uses: ./.github/workflows/genevn-nuki.yml
    secrets: inherit
    with:
      device_codename: ${{ inputs.device_codename }}
      kernel_branch: ${{ inputs.kernel_branch }}
