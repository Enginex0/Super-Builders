permissions:
  contents: write
  actions: write

concurrency:
  group: s928b-resukisu-35220-zzi4-uidgate-v1-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  gunyah-preflight:
    name: UID gate and Gunyah exact-C preflight tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Validate transformation, budget bounds and exact C function
        run: |
          set -euo pipefail
          python3 android14-6.1/build-helpers/test-bakasu-35220-bindings.py
          python3 android14-6.1/build-helpers/test-e3q-gunyah-adaptive-backing.py
          python3 android14-6.1/build-helpers/test-e3q-gunyah-reclaim.py
          python3 android14-6.1/build-helpers/susfs-uid-gated/test.py --cc gcc --work-dir "$RUNNER_TEMP/uid-gate-tests"

  userspace:
    needs: gunyah-preflight
    uses: ./.github/workflows/build-resukisu-userspace.yml
    with:
      resukisu_commit: 8450dd287ef6ee25ca2b6b858b43c9354c73060c
      resukisu_version_code: "35220"

  dependencies:
    needs: gunyah-preflight
    uses: ./.github/workflows/cache-dependencies.yml

  zeromount-compat:
    needs: gunyah-preflight
    uses: ./.github/workflows/build-zeromount-bakasu.yml

  strict-gate:
    name: Full strict KMI gate / BakaSU 35220 UAPI5 / OPEN_REDIRECT / UID-gated hiding v1 / Gunyah
    needs: [dependencies, userspace, zeromount-compat]
    uses: ./.github/workflows/build-resukisu.yml
    permissions:
      contents: write
      actions: write
    with:
      android_version: android14
      kernel_version: "6.1"
      sub_level: "162"
      os_patch_level: "2026-03"
      add_susfs: true
      susfs_uid_gated_hiding: true
      add_zeromount: true
      add_droidspaces: true
      add_zram: true
      add_bbg: true
      add_overlayfs_support: true
      add_kpm: false
      susfs_open_redirect: true
      # Adapt the SUSFS 24743360 callback to native UAPI5, retaining the explicit
      # session decision and success guard from reference run 34262304602.
      # The legacy 35119/UAPI2 backport is not applicable to native UAPI5.
      susfs_su_session: false
      add_ptrace_fix: true
      add_perf_patches: true
      sukisu_commit: 8450dd287ef6ee25ca2b6b858b43c9354c73060c
      resukisu_source_branch: main
      resukisu_version_code: "35220"
      device_codename: e3q
      kmi_mode: strict
      kmi_profile: full-strict
      kmi_minimal_config: false
      package_strict_anykernel: true

